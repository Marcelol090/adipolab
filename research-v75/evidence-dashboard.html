<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>AdipoLab — Evidências</title><style>:root{color-scheme:light dark;--bg:#f5f5f7;--fg:#24242d;--card:#fff;--line:#d8d8e1;--muted:#63636e;--link:#4c489e}*{box-sizing:border-box}body{background:var(--bg);color:var(--fg);margin:0;font:15px/1.5 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:24px 16px}h1{font-size:clamp(24px,4vw,36px);margin:14px 0 4px}h2{font-size:19px}a{color:var(--link)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:12px}.card{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow-wrap:anywhere}.muted,small{color:var(--muted)}.metrics strong{display:block;font-size:28px;letter-spacing:-1px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.controls label{display:grid;gap:4px;flex:1;min-width:min(160px,100%)}input,select{font:inherit;width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card);color:var(--fg)}.bar{height:18px;display:flex;border-radius:6px;overflow:hidden;margin:12px 0}.bar span{height:100%}.a{background:#43866d}.b{background:#c59d55}.c{background:#9b9ba8}.status{font-size:12px;text-transform:uppercase;letter-spacing:.04em}.card h3{font-size:16px;margin:6px 0}.card p{margin:6px 0} @media(prefers-color-scheme:dark){:root{--bg:#17171e;--fg:#f5f5fa;--card:#22232c;--line:#3f414c;--muted:#b4b4c2;--link:#c3bbff}}</style></head><body><main><a href="./lab.html">← Laboratório</a><h1>Painel de evidências</h1><p class="muted">v161 · Auditoria de fontes e qualidade de medição. Nenhuma validação clínica individual.</p><section id="benchmark" aria-label="Metabolômica"><h2>Reprodutibilidade do ensaio publicado</h2><div id="metrics" class="grid metrics"></div><div id="bar" class="bar" role="img" aria-label="Distribuição de resultados de precisão"></div><p id="detail"></p><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6317696/">Fonte: artigo e tabela 1</a></section><h2>Fontes reavaliadas</h2><div class="controls"><label>Buscar fonte<input id="query" placeholder="Tema, título ou identificador"></label><label>Estado<select id="status"><option value="">Todos</option><option value="verified">Contagens reconferidas</option><option value="partial">Acesso parcial</option><option value="corrected">Errata documentada</option></select></label></div><p id="count" role="status"></p><section id="records" class="grid"></section><h2>Lacunas científicas</h2><section id="gaps" class="grid"></section><p><a href="./evidence-dashboard.json">Registro JSON versionado</a></p><p id="error" role="alert"></p><script type="module" src="./evidence-dashboard-ui.mjs"></script></main></body></html>
